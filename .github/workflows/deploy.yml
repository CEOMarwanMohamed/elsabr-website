name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    env:
      # The `secrets` context is not available in a step-level `if`, so surface
      # these here to let the deploy step test whether they are configured.
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      # Deploys only once the Cloudflare secrets exist, so the build still
      # reports green before the Pages project is connected.
      - name: Publish to Cloudflare Pages
        if: >-
          github.event_name != 'pull_request' &&
          env.CF_API_TOKEN != '' &&
          env.CF_ACCOUNT_ID != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ env.CF_API_TOKEN }}
          accountId: ${{ env.CF_ACCOUNT_ID }}
          command: pages deploy dist --project-name=elsabr-website
