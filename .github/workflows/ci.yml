name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Build and typecheck only. Deployment belongs to the Cloudflare Pages Git
# integration, which builds this repo itself — having both deploy would race
# and produce a duplicate deployment on every push.
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build
